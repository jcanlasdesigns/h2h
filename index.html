<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H2H Environmental Consulting - Coming Soon</title>
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --primary-green: #08783f;
      --secondary-green: #5aae45;
      --light-green: #dcefd8;
      --dark-bg: #050b14;
      --white: #ffffff;
      --light-bg: #f6f8f6;
      --text-dark: #18221c;
      --text-light: #66706a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius: 12px;
      --transition: 0.3s ease;
      --font: 'Inter', sans-serif;
    }

    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: var(--font);
      color: var(--white);
      background: var(--dark-bg);
      line-height: 1.6;
      overflow: hidden;
      height: 100vh;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
    }
    img {
      max-width: 100%;
      display: block;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      background: rgba(5, 11, 20, 0.8);
      color: rgba(255, 255, 255, 0.8);
      padding: 6px 0;
      font-size: 0.82rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      z-index: 10;
    }
    .top-bar .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 16px;
    }
    .top-bar .contact-info {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
    }
    .top-bar .contact-info span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .top-bar .contact-info i {
      color: var(--secondary-green);
      font-size: 0.8rem;
      width: 14px;
    }
    .top-bar .social-icons {
      display: flex;
      gap: 10px;
    }
    .top-bar .social-icons a {
      color: rgba(255, 255, 255, 0.6);
      transition: var(--transition);
    }
    .top-bar .social-icons a:hover {
      color: var(--secondary-green);
    }

    @media (max-width: 768px) {
      .top-bar {
        display: none;
      }
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--dark-bg);
    }

    .hero-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      object-fit: cover;
    }
    .hero-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-background .fallback-img {
      display: none;
    }
    .hero video:not(:loaded) ~ .fallback-img {
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(8, 120, 63, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(90, 174, 69, 0.12) 0%, transparent 50%),
        linear-gradient(135deg, rgba(5, 11, 20, 0.85) 0%, rgba(5, 11, 20, 0.6) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      text-align: center;
    }

    /* Logo centered */
    .hero-logo {
      margin-bottom: 32px;
      display: flex;
      justify-content: center;
    }
    .hero-logo img {
      height: 80px;
      width: auto;
      display: block;
    }

    /* Coming Soon - Big & Bold */
    .hero-content .coming-soon {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 12px;
      text-shadow: 0 4px 40px rgba(8, 120, 63, 0.2);
    }
    .hero-content .coming-soon .highlight {
      color: var(--secondary-green);
    }

    .hero-content .hero-tagline {
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.8);
      max-width: 600px;
      margin: 0 auto 8px;
    }

    .hero-content .hero-sub {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.5);
      max-width: 500px;
      margin: 0 auto 0;
    }

    /* Decorative leaf */
    .hero-leaf {
      position: absolute;
      right: 5%;
      bottom: 10%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle at 30% 40%, rgba(90, 174, 69, 0.1), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    .hero-leaf::after {
      content: "🌿";
      font-size: 6rem;
      opacity: 0.12;
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .fade-in {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
    }
    .delay-1 {
      animation-delay: 0.2s;
    }
    .delay-2 {
      animation-delay: 0.4s;
    }
    .delay-3 {
      animation-delay: 0.6s;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(24px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== FLOATING SOCIAL / ACTION BUTTONS ===== */
    .floating-actions {
      position: fixed;
      right: 20px;
      bottom: 100px;
      z-index: 998;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .floating-actions a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      color: var(--white);
      font-size: 1.4rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: var(--transition);
      text-decoration: none;
    }
    .floating-actions a:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }
    .floating-actions .fb-messenger {
      background: #0084ff;
    }
    .floating-actions .phone-call {
      background: var(--primary-green);
    }
    .floating-actions .phone-call i {
      transform: rotate(90deg);
    }

    @media (max-width: 768px) {
      .floating-actions {
        right: 12px;
        bottom: 80px;
        gap: 10px;
      }
      .floating-actions a {
        width: 42px;
        height: 42px;
        font-size: 1rem;
      }
      .hero-logo img {
        height: 60px;
      }
      .hero-content .coming-soon {
        font-size: 3.5rem;
      }
      .hero-content .hero-tagline {
        font-size: 1.1rem;
      }
      .hero-content .hero-sub {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      .hero-logo img {
        height: 50px;
      }
      .hero-content .coming-soon {
        font-size: 2.8rem;
      }
      .hero-content .hero-tagline {
        font-size: 0.95rem;
      }
      .hero-content .hero-sub {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <!-- ===== TOP BAR ===== -->
  <div class="top-bar">
    <div class="container">
      <div class="contact-info">
        <span><i class="fas fa-phone"></i> Luzon: 0927 227 601</span>
        <span><i class="fas fa-phone"></i> Davao/Mindanao: 0966 462 1574</span>
        <span><i class="fas fa-envelope"></i> h2henvironservices@outlook.com</span>
        <span><i class="fas fa-map-marker-alt"></i> Dasmariñas, Cavite</span>
      </div>
      <div class="social-icons">
        <a href="https://www.facebook.com/emceenvironmentalteam" target="_blank" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="https://m.me/emceenvironmentalteam" target="_blank" aria-label="Messenger"><i class="fab fa-facebook-messenger"></i></a>
      </div>
    </div>
  </div>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="hero-background">
      <video autoplay muted loop playsinline id="heroVideo">
        <source src="videos/hero-video.mp4" type="video/mp4" />
        <img src="images/hero-bg.png" alt="Hero background" class="fallback-img" />
      </video>
      <img src="images/hero-bg.png" alt="Hero background" style="display:none;" id="heroFallbackImg" />
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-leaf"></div>

    <div class="hero-content">
      <!-- Logo centered -->
      <div class="hero-logo fade-in">
        <img src="images/logo.png" alt="H2H Environmental Logo" onerror="this.style.display='none'" />
      </div>

      <!-- Coming Soon - Big & Bold -->
      <h1 class="coming-soon fade-in delay-1">
        Coming <span class="highlight">Soon</span>
      </h1>

      <p class="hero-tagline fade-in delay-2">
        Caring for the Earth, Securing the Future.
      </p>

      <p class="hero-sub fade-in delay-3">
        Empowering progress and ensuring compliance with H2H Environmental Consulting Services.
      </p>
    </div>
  </section>

  <!-- ===== FLOATING ACTION BUTTONS ===== -->
  <div class="floating-actions">
    <a href="https://m.me/emceenvironmentalteam" target="_blank" class="fb-messenger" aria-label="Message us on Messenger">
      <i class="fab fa-facebook-messenger"></i>
    </a>
    <a href="tel:0927227601" class="phone-call" aria-label="Call us">
      <i class="fas fa-phone"></i>
    </a>
  </div>

  <script>
    (function() {
      "use strict";

      // ===== HERO VIDEO FALLBACK =====
      const video = document.getElementById('heroVideo');
      const fallbackImg = document.getElementById('heroFallbackImg');

      if (video) {
        video.addEventListener('error', function() {
          if (fallbackImg) {
            fallbackImg.style.display = 'block';
          }
          video.style.display = 'none';
        });
        setTimeout(function() {
          if (video.readyState === 0 || video.networkState === 3) {
            if (fallbackImg) {
              fallbackImg.style.display = 'block';
            }
            video.style.display = 'none';
          }
        }, 3000);
      }

    })();
  </script>
</body>
</html>
